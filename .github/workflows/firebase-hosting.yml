name: Firebase Hosting CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase env file
        run: |
          npm install -g firebase-tools
          firebase apps:sdkconfig web 1:788728298296:web:240a096fddc34243e29fcd --project project-38acbfd0-4f80-43f7-8fa > firebase-config.json
          node <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync('firebase-config.json', 'utf8')
          const jsonStart = text.indexOf('{')
          if (jsonStart === -1) {
            throw new Error('Firebase SDK config was not returned by the CLI')
          }

          const config = JSON.parse(text.slice(jsonStart))
          const lines = [
            `VITE_FIREBASE_API_KEY=${config.apiKey ?? ''}`,
            `VITE_FIREBASE_AUTH_DOMAIN=${config.authDomain ?? ''}`,
            `VITE_FIREBASE_PROJECT_ID=${config.projectId ?? ''}`,
            `VITE_FIREBASE_STORAGE_BUCKET=${config.storageBucket ?? ''}`,
            `VITE_FIREBASE_MESSAGING_SENDER_ID=${config.messagingSenderId ?? ''}`,
            `VITE_FIREBASE_APP_ID=${config.appId ?? ''}`,
            `VITE_FIREBASE_MEASUREMENT_ID=${config.measurementId ?? ''}`,
          ]

          fs.writeFileSync('.env.production', `${lines.join('\n')}\n`)
          NODE

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project project-38acbfd0-4f80-43f7-8fa
